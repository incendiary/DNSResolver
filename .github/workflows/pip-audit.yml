name: Dependency audit

on:
  schedule:
    - cron: "0 7 * * 1"  # Every Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Audit locked dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements-dev.lock
